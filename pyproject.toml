[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  "prek==0.4.5",
  "pyright==1.1.410",
  "ruff==0.15.18",
  "toml-sort==0.24.4"
]
docs = [
  "sphinx",
  "myst-nb",
  "sphinx-book-theme",
  "sphinx-copybutton"
]
tests = [
  "jax-fli[all]",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-timeout",
  # build dependencies for the no-build-isolation oracle backends below:
  "cython",
  "numpy",
  "mpi4py",
  "setuptools",
  "wheel",
  # oracle / reference backends used by the comparison tests ([tool.uv.sources] below):
  "fastpm",
  "pfft-python",
  "pmesh",
  "glass[examples]",
  "discodj",
  "pymaster"
]

[project]
authors = [
  {email = "wassim@apc.in2p3.fr", name = "Wassim Kabalan"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "jax>=0.10.1",
  "equinox",
  "jaxtyping",
  "jaxpm",
  "jax-cosmo",
  "healpy",
  "jax-healpy[recommended]>=0.7.0",
  # s2fft is already pulled by jax-healpy[recommended]; declared directly so the
  # [tool.uv.sources] override below binds (uv sources apply to direct deps only).
  "s2fft"
]
description = "Forward-modeling and sampling on top of JAXPM + JAX-Decomp"
dynamic = ["version"]
keywords = ["jax", "cosmology", "nbody", "sampling", "mcmc", "bayesian-inference"]
license = {text = "MIT"}
name = "jax-fli"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
# Deliberately excludes `cuda` so `tests` (which pulls jax-fli[all]) keeps CI on CPU JAX.
all = ["jax_fli[catalog, sampling, raytrace, plot, benchmark]"]
benchmark = ["jax-hpc-profiler>=0.3.3"]
catalog = [
  "datasets>=2.0",
  "huggingface_hub>=0.20",
  "h5py"
]
cuda = ["jax[cuda]>=0.10.1"]
examples = [
  "ipython",
  "ipykernel",
  "ipywidgets",
  "papermill"
]
legacy = ["diffrax"]
plot = [
  "matplotlib>=3.0",
  "getdist",
  "arviz",
  "tabulate"
]
raytrace = ["dorian-raytrace-mpi"]
sampling = [
  "blackjax",
  "numpyro",
  "orbax-checkpoint",
  "fastprogress",
  "jax-cadre",
  "optimistix"
]
# Spherical starlet wavelets (SphericalDensity.starlet_coefficients) need CosmoStat, which
# imports as `pycs` and ships a C++ backend with a non-trivial build.
starlet = ["pycs"]

[project.urls]
Documentation = "https://jax-fli.readthedocs.io"
Homepage = "https://github.com/DifferentiableUniverseInitiative/jax-fli"
Issues = "https://github.com/DifferentiableUniverseInitiative/jax-fli/issues"
Repository = "https://github.com/DifferentiableUniverseInitiative/jax-fli"

[tool.hatch.build.targets.sdist]
include = ["src/jax_fli", "bin", "tests", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/jax_fli"]

# Scripts are installed verbatim into the env's bin/ (NOT as [project.scripts] entry
# points): each bin/fli-* sets env vars and runs jax.distributed.initialize() BEFORE
# importing the package, so they must not import jax_fli at console-script generation.
[tool.hatch.build.targets.wheel.shared-scripts]
"bin/fli-2pcf" = "fli-2pcf"
"bin/fli-born-rt" = "fli-born-rt"
"bin/fli-dorian-rt" = "fli-dorian-rt"
"bin/fli-extract" = "fli-extract"
"bin/fli-infer" = "fli-infer"
"bin/fli-launcher" = "fli-launcher"
"bin/fli-samples" = "fli-samples"
"bin/fli-simulate" = "fli-simulate"

[tool.hatch.version]
source = "vcs"

[tool.pyright]
exclude = ["**/node_modules", "**/__pycache__", ".git"]
include = ["src"]
pythonPlatform = "Linux"
pythonVersion = "3.10"
reportGeneralTypeIssues = false
reportMissingImports = false
reportUndefinedVariable = false

[tool.pytest.ini_options]
addopts = "-v --cov=jax_fli --cov-report=term-missing"
markers = [
  "distributed: tests requiring multi-device JAX setup (8 CPU devices or SLURM)",
  "single_device: tests that run on a single device (default)",
  "slow: tests that are too slow for CI",
  "scripts: end-to-end CLI script validation tests (fli-simulate)"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 9000
timeout_method = "thread"

[tool.ruff]
fix = true
include = ["*.py", "*.ipynb"]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "E501", # line too long
  "E402", # module level import not at top of file
  "E731", # do not assign a lambda expression, use a def
  "F722", # syntax error in type annotation
  "UP007"
]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "UP", # pyupgrade
  "T10", # flake8-debugger
  "I" # isort
]

[tool.uv]
# Don't install any dependency group by default (uv's built-in default is ["dev"]).
# A plain `uv sync` now installs only the project + its deps; opt into groups
# explicitly with `--group dev` / `--group tests`, or `--all-groups`.
default-groups = []

# The MP-Gadget backends use legacy setup.py builds that import setuptools/cython/numpy/mpi4py
# without declaring them as build deps. Provide those so they build under normal isolation
# (cleaner than a global no-build-isolation toggle — which is what broke glass's build in CI).
# The system FFTW/MPI they link against come from the apt step, not from here.
[tool.uv.extra-build-dependencies]
fastpm = ["setuptools", "wheel", "cython", "numpy", "mpi4py"]
pfft-python = ["setuptools", "wheel", "cython", "numpy", "mpi4py"]
pmesh = ["setuptools", "wheel", "cython", "numpy", "mpi4py"]

# jaxpm/jax-cosmo/s2fft are declared by their PyPI names above; the oracle backends live in
# the `tests` group. The git sources here override all of them to the pinned forks/branches
# for local dev + locking. uv strips [tool.uv.sources] from the published wheel, so released
# metadata depends only on the plain PyPI names.
[tool.uv.sources]
blackjax = {branch = "progressbar-mclmc", git = "https://github.com/ASKabalan/blackjax"}
discodj = {git = "https://github.com/cosmo-sims/DISCO-DJ.git"}
fastpm = {git = "https://github.com/ASKabalan/fastpm-python"}
glass = {git = "https://github.com/glass-dev/glass"}
jax-cosmo = {branch = "better-cache", git = "https://github.com/ASKabalan/jax_cosmo"}
jaxpm = {branch = "notebook-and-docs-update", git = "https://github.com/DifferentiableUniverseInitiative/JaxPM.git"}
optimistix = {branch = "add-progress", git = "https://github.com/ASKabalan/optimistix.git"}
pfft-python = {git = "https://github.com/MP-Gadget/pfft-python"}
pmesh = {git = "https://github.com/MP-Gadget/pmesh"}
pycs = {branch = "master", git = "https://github.com/CosmoStat/cosmostat"}
s2fft = {branch = "main", git = "https://github.com/astro-informatics/s2fft"}
