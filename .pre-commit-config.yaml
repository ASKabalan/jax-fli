repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Python tooling runs as local hooks against the uv-installed tools (the `dev` group pins
  # ruff/pyright/toml-sort). `language: system` + `uv run` means no Node and no isolated hook
  # envs, so `prek run` works. `--no-sync` keeps a hook from triggering a full default-groups
  # sync (which would build the heavy oracle backends just to lint).
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync -- ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync -- ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      # Manual stage: pyright is NOT run by `prek run --all-files` (CI gate) because src/
      # currently has a large backlog of pre-existing type errors. Run it on demand with
      # `uv run pyright` or `prek run pyright --hook-stage manual`.
      - id: pyright
        name: pyright
        entry: uv run --no-sync -- pyright
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [manual]
      - id: toml-sort
        name: toml-sort
        entry: uv run --no-sync -- toml-sort -i --sort-table-keys --sort-inline-tables
        language: system
        files: ^pyproject\.toml$

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.24
    hooks:
      - id: uv-lock
