name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (MPI, GSL, FFTW)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            pkg-config \
            cmake \
            ninja-build \
            openmpi-bin \
            libopenmpi-dev \
            libgsl-dev \
            libfftw3-dev \
            libfftw3-mpi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel hatchling hatch-vcs packaging hatch-fancy-pypi-readme
          python -m pip install --upgrade scikit-build-core cmake ninja

          python -m pip install --upgrade pybind11
          echo "CMAKE_PREFIX_PATH=$(python -m pybind11 --cmakedir)" >> $GITHUB_ENV

          pip install "jax[cpu]"
          pip install -e ".[dev,catalog,sampling]"
          pip install cython mpi4py
          pip install -r tests/requirements.txt --no-build-isolation

      - name: Run distributed tests
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_force_host_platform_device_count=8"
        run: |
          pytest -m distributed

      - name: Run non-distributed tests
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          pytest -m "not distributed and not slow"
