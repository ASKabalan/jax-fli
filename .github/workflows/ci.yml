name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # editable install below → hatch-vcs needs full history

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.11"

      # Only the dev tooling (ruff/pyright/toml-sort/prek) — no oracle C-extension builds.
      - name: Install dev tooling
        run: uv sync --locked --group dev

      - name: Run prek
        run: uv run --no-sync prek run --all-files

  test:
    name: Run tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for hatch-vcs versioning

      - name: Install system dependencies (MPI, GSL, FFTW, cfitsio)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            pkg-config \
            cmake \
            ninja-build \
            openmpi-bin \
            libopenmpi-dev \
            libgsl-dev \
            libfftw3-dev \
            libfftw3-mpi-dev \
            libcfitsio-dev

      - name: Install uv and set up environment
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The `tests` group carries jax-fli[all] (every feature extra) + pytest + all oracle
      # backends, so this installs everything needed to run the suite.
      - name: Install test environment
        run: uv sync --locked --group tests

      - name: Run non-distributed, non-scripts tests
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync pytest -m "not distributed and not scripts and not slow"

      - name: Run distributed tests
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_force_host_platform_device_count=8"
        run: uv run --no-sync pytest -m distributed

      - name: Run scripts tests
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync pytest -m scripts

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"

      # Docs build never installs jax_fli itself (no autodoc, notebooks ship pre-executed
      # outputs) — just the docs group, matching .readthedocs.yaml.
      - name: Install docs environment
        run: uv sync --locked --only-group docs --no-install-project

      - name: Build docs with Sphinx
        run: uv run --no-sync sphinx-build -b html docs docs/_build/html
